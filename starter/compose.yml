services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: starter
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5444/spring-boot
      SPRING_DATASOURCE_USERNAME: nyusss
      SPRING_DATASOURCE_PASSWORD: jonogemoy

      SPRING_FLYWAY_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped